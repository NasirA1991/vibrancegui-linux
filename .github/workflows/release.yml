name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release (for example v0.1.1)
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Resolve version
        shell: bash
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1-mesa-dev libegl1-mesa-dev libxkbcommon-dev libwayland-dev \
            libx11-dev libxcursor-dev libxi-dev libxrandr-dev libxinerama-dev \
            libfontconfig1-dev pkg-config wget ca-certificates

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --all-targets --locked

      - name: Build release
        run: cargo build --release --locked

      - name: Build AppImage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/scalable/apps
          cp target/release/vibrancegui AppDir/usr/bin/vibrancegui
          cp packaging/vibrancegui.desktop AppDir/usr/share/applications/vibrancegui.desktop
          cp packaging/vibrancegui.svg AppDir/usr/share/icons/hicolor/scalable/apps/vibrancegui.svg
          cp packaging/vibrancegui.desktop AppDir/vibrancegui.desktop
          cp packaging/vibrancegui.svg AppDir/vibrancegui.svg
          cp packaging/vibrancegui.svg AppDir/.DirIcon
          printf '%s\n' '#!/bin/sh' 'exec "$APPDIR/usr/bin/vibrancegui" "$@"' > AppDir/AppRun
          chmod +x AppDir/AppRun
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 \
            ./appimagetool-x86_64.AppImage AppDir "dist/vibrancegui-linux-${VERSION}-x86_64.AppImage"
          cp target/release/vibrancegui dist/vibrancegui
          (cd dist && sha256sum vibrancegui "vibrancegui-linux-${VERSION}-x86_64.AppImage" > SHA256SUMS)

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.TAG }}
          generate_release_notes: true
          files: |
            dist/vibrancegui
            dist/vibrancegui-linux-${{ env.VERSION }}-x86_64.AppImage
            dist/SHA256SUMS

      - name: Generate AUR PKGBUILD
        shell: bash
        run: |
          mkdir -p packaging/aur/generated
          sed "s/@VERSION@/${VERSION}/g" packaging/aur/PKGBUILD.in > packaging/aur/generated/PKGBUILD

      - name: Publish AUR package
        uses: KSXGitHub/github-actions-deploy-aur@v4.2.0
        with:
          pkgname: vibrancegui-linux
          pkgbuild: packaging/aur/generated/PKGBUILD
          updpkgsums: true
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "vibrancegui-linux ${{ env.VERSION }}-1"
          ssh_keyscan_types: rsa,ecdsa,ed25519
